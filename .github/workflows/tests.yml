name: tests

on:
  push:
  pull_request:

jobs:
  vba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice (Excel の代わりに VBA を実行する)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno

      - name: Run VBA tests
        run: python3 tests/run.py
